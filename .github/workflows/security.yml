name: security

# 安全作业独立于 ci.yml：CI 的路径裁剪是 fail-open，安全门禁不能被静默跳过。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 11:23（UTC+8）：无代码变更也能发现新披露漏洞与新增规则命中。
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks 扫全历史，浅克隆会漏掉既有提交
      - name: gitleaks
        run: |
          VERSION=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/gitleaks_${VERSION}_checksums.txt" -o /tmp/gitleaks.sha
          curl -sSfL "${BASE}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          (cd /tmp && grep " gitleaks_${VERSION}_linux_x64.tar.gz\$" gitleaks.sha | sha256sum --check)
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --verbose --exit-code 1

  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true
      # 版本钉死：govulncheck 随漏洞库演进，latest 不可复现；有可达漏洞时非零退出。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: syft
        run: |
          VERSION=1.57.2
          BASE="https://github.com/anchore/syft/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/syft_${VERSION}_checksums.txt" -o /tmp/syft.checksums
          curl -sSfL "${BASE}/syft_${VERSION}_linux_amd64.tar.gz" -o /tmp/syft.tar.gz
          (cd /tmp && grep " syft_${VERSION}_linux_amd64.tar.gz\$" syft.checksums | sha256sum --check)
          sudo tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          syft dir:. -c .syft.yaml -o cyclonedx-json=sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom.cdx.json
          path: sbom.cdx.json
          retention-days: 30

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends shellcheck
      - name: actionlint
        run: |
          VERSION=1.7.12
          BASE="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/actionlint_${VERSION}_checksums.txt" -o /tmp/actionlint.sha
          curl -sSfL "${BASE}/actionlint_${VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          (cd /tmp && grep " actionlint_${VERSION}_linux_amd64.tar.gz\$" actionlint.sha | sha256sum --check)
          sudo tar -xzf /tmp/actionlint.tgz -C /usr/local/bin actionlint
          actionlint -color
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: yamllint
        run: uvx yamllint==1.38.0 -c .yamllint.yml .github
      - name: hadolint
        run: |
          VERSION=2.15.1
          curl -sSfL "https://github.com/hadolint/hadolint/releases/download/v${VERSION}/hadolint-linux-x86_64" -o /tmp/hadolint
          chmod +x /tmp/hadolint
          /tmp/hadolint Containerfile
